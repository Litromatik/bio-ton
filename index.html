<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Mini APS — Офлайн заявки</title>
  <meta name="theme-color" content="#2E8B3A">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    /* ===== Base palette (matches the tractor image) ===== */
    :root{
      --bg: #f2f6f8;
      --card: rgba(255,255,255,0.95);
      --muted: #6b7280;
      --text: #0f172a;
      --accent: #2E8B3A;     /* green */
      --accent-2: #F6C941;   /* yellow */
      --radius: 14px;
      --shadow: 0 12px 30px rgba(15,23,42,0.06);
      --glass: rgba(255,255,255,0.75);
    }
    [data-theme="dark"]{
      --bg: #0b1220;
      --card: rgba(8,12,18,0.85);
      --muted: #9aa7b2;
      --text: #e6eef8;
      --glass: rgba(6,10,15,0.6);
    }

    *{box-sizing:border-box}
    html,body{height:100%;margin:0}
    body{
      font-family:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial;
      background:var(--bg);
      color:var(--text);
      -webkit-font-smoothing:antialiased;
      -moz-osx-font-smoothing:grayscale;
      display:flex;
      justify-content:center;
      padding:18px;
      line-height:1.35;
    }

    /* Background image (centered, dimmed) */
    .bg-wrap{
      position:fixed; inset:0; z-index:-10; display:block;
     background-image: url('./static/bg.jpg');
      background-position: center center;
      background-size: cover;
      filter: blur(6px) contrast(1.02) saturate(1.02);
      opacity:0.95;
      transform: scale(1.02);
    }
    .bg-overlay{ position:fixed; inset:0; z-index:-9; background: linear-gradient(rgba(255,255,255,0.72), rgba(255,255,255,0.72)); pointer-events:none; }

    /* Layout */
    .wrap{ width:100%; max-width:1120px; }
    header{ display:flex; justify-content:space-between; align-items:center; gap:12px; margin-bottom:18px; }
    h1{ margin:0; font-size:20px; font-weight:700; letter-spacing:0.2px; }
    .hint{ color:var(--muted); font-size:13px; margin-top:4px; }

    .grid{ display:grid; grid-template-columns:420px 1fr; gap:18px; align-items:start; }
    @media (max-width:960px){ .grid{ grid-template-columns: 1fr; } }

    /* Cards / forms */
    .card{ background:var(--card); border-radius:var(--radius); padding:18px; box-shadow:var(--shadow); border:1px solid rgba(15,23,42,0.04); }
    label{ display:block; font-size:13px; color:var(--muted); margin-top:12px; }
    input[type="text"], input[type="tel"], textarea, select {
      width:100%; padding:12px; margin-top:8px; border-radius:10px; border:1px solid rgba(15,23,42,0.06); background:transparent; font-size:14px; color:var(--text);
    }
    textarea{ min-height:88px; resize:vertical; }
    .row{ display:flex; gap:12px; }
    .col{ flex:1; }

    .actions{ display:flex; gap:12px; margin-top:16px; flex-wrap:wrap; }
    .btn{
      display:inline-flex; align-items:center; gap:8px; padding:10px 14px; border-radius:10px; border: none; cursor:pointer; font-weight:700; font-size:14px;
      box-shadow: 0 6px 16px rgba(15,23,42,0.06);
    }
    .btn-primary{ background: linear-gradient(180deg, var(--accent), #1f6a2b); color: white; }
    .btn-ghost{ background: transparent; color: var(--accent); border: 1px solid rgba(15,23,42,0.06); }

    .small{ font-size:13px; color:var(--muted); }
    .statusbar{ display:flex; gap:10px; align-items:center; color:var(--muted); }

    /* Queue */
    .toolbar{ display:flex; justify-content:space-between; align-items:center; gap:12px; margin-bottom:12px; }
    .cards{ display:grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap:12px; }
    .req-card{ background:var(--glass); border-radius:12px; padding:12px; border:1px solid rgba(15,23,42,0.04); }

    /* Modal */
    .modal-backdrop{ position:fixed; inset:0; display:none; align-items:center; justify-content:center; z-index:1200; background: rgba(6,10,15,0.45); }
    .modal{ width:calc(100% - 48px); max-width:880px; background:var(--card); border-radius:12px; padding:18px; box-shadow:var(--shadow); max-height:86vh; overflow:auto; }
    .skeleton{ background:linear-gradient(90deg, rgba(0,0,0,0.03), rgba(0,0,0,0.06)); height:14px; border-radius:6px; opacity:.7; }

    /* Toasts */
    .toasts{ position:fixed; right:18px; bottom:18px; display:flex; flex-direction:column; gap:8px; z-index:1400; }
    .toast{ background:rgba(0,0,0,0.8); color:white; padding:10px 14px; border-radius:10px; font-size:13px; }

    /* Buttons in controls */
    .controls{ display:flex; gap:8px; margin-top:10px; flex-wrap:wrap; }
    button.ghost{ background:transparent; border:1px solid rgba(15,23,42,0.06); color:var(--accent); padding:8px 10px; border-radius:8px; cursor:pointer; }

    /* Mobile touch improvements */
    button, a, input[type="file"], .controls button { -webkit-tap-highlight-color: rgba(0,0,0,0); touch-action: manipulation; cursor: pointer; }

    /* small helpers */
    .muted{ color:var(--muted); font-size:13px; }
  </style>
</head>
<body>
  <div class="bg-wrap" aria-hidden="true"></div>
  <div class="bg-overlay" aria-hidden="true"></div>

  <div class="wrap">
    <header>
      <div>
        <h1>Mini APS — Офлайн заявки</h1>
        <div class="hint">Быстрое создание заявок — сохраняются локально и отправляются при сети</div>
      </div>
      <div class="statusbar">
        <div class="small">Сеть: <span id="statusText" class="muted">offline</span></div>
        <div class="small" id="lastSync">—</div>
        <!-- inline onclick как гарантированный fallback -->
        <button id="themeToggle" class="ghost" title="Тема" onclick="(window.toggleThemeUI || (()=>{}))()">Тема</button>
      </div>
    </header>

    <div class="grid">
      <section class="card" aria-labelledby="form-title">
        <h2 id="form-title" class="small" style="margin:0 0 8px 0;">Новая заявка</h2>
        <form id="form" autocomplete="off">
          <label>Модель / Оборудование *</label>
          <div style="display:flex; gap:8px; align-items:center;">
            <input id="model_name" type="text" required placeholder="Например: КО-505" />
            <input id="plate" type="text" required placeholder="Гос. номер" style="width:160px" />
            <!-- inline onclick как гарантированный fallback -->
            <button type="button" id="chooseEquipmentBtn" class="btn btn-ghost" onclick="(window.openEquipmentModal || (()=>{}))()">Выбрать</button>
          </div>

          <label>Год (заполняется при выборе техники)</label>
          <input id="year" type="text" placeholder="автоматически" readonly />

          <label>Показание одометра</label>
          <input id="odometer" type="text" placeholder="485" />

          <label>Описание</label>
          <textarea id="description" placeholder="Краткое описание проблемы (до 2000 символов)"></textarea>

          <label>Запчасти</label>
          <textarea id="spare_parts" placeholder="Перечислите, если есть"></textarea>

          <div class="row" style="margin-top:8px;">
            <div class="col">
              <label>Телефон</label>
              <input id="phone" type="tel" placeholder="+7..." />
            </div>
            <div class="col">
              <label>Ф.И.О. ответственного</label>
              <input id="responsible_person" type="text" placeholder="Иванов Иван Иванович"/>
            </div>
          </div>

          <label style="margin-top:12px;">Фото (опционально)</label>
          <input id="photo" type="file" accept="image/*" capture="environment" />

          <div class="actions">
            <button type="submit" id="addBtn" class="btn btn-primary">Добавить в очередь</button>
            <button type="button" id="syncBtn" class="btn">Синхронизировать</button>
            <button type="button" id="clearBtn" class="btn btn-ghost">Очистить очередь</button>
          </div>
        </form>
      </section>

      <section class="card" aria-labelledby="queue-title">
        <div class="toolbar">
          <div>
            <h3 id="queue-title" class="small" style="margin:0;">Очередь заявок</h3>
            <div class="muted">Локально: <span id="queueCount">0</span></div>
          </div>

          <div style="display:flex; gap:8px; align-items:center;">
            <input id="qSearch" placeholder="Поиск (модель, номер)..." style="padding:10px;border-radius:10px;border:1px solid rgba(0,0,0,0.06)" />
            <select id="statusFilter" style="padding:10px;border-radius:10px;border:1px solid rgba(0,0,0,0.06)">
              <option value="">Все статусы</option>
              <option value="pending">Pending</option>
              <option value="syncing">Syncing</option>
              <option value="ok">OK</option>
              <option value="error">Error</option>
            </select>
            <button id="filterBtn" class="btn btn-ghost">Применить</button>
          </div>
        </div>

        <div id="cardsWrap">
          <div class="cards" id="cardsList"></div>
        </div>
      </section>
    </div>
  </div>

  <div class="toasts" id="toasts" aria-live="polite"></div>

  <div class="modal-backdrop" id="modalBackdrop" role="dialog" aria-modal="true">
    <div class="modal" id="modalContent"></div>
  </div>

  <div class="modal-backdrop" id="equipmentModal" aria-hidden="true">
    <div class="modal" id="equipmentModalContent"></div>
  </div>

  <script src="./static/app.js"></script>
</body>
</html>
